
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Portal | Naman Creative Advertising</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <main class="admin-container">

        <!-- Login section -->
        <section class="login-card" id="login-section">
            <h1>Naman Creative</h1>
            <p>Admin Portal</p>

            <form id="login-form">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">Log In</button>

                <p id="login-error" role="alert"></p>
            </form>
        </section>

        <!-- Dashboard section: hidden until login -->
        <section id="dashboard-section" hidden>
            <h1>Enquiry Inbox</h1>

            <button id="logout-button" type="button">
                Log Out
            </button>

            <p id="dashboard-message" role="status"></p>

            <div id="enquiries-container"></div>

            <section id="products-section">
                <h1>Product Management</h1>
                <p>Manage your product catalogue here.</p>
    
                <button id="add-product-button" type="button">
                    + Add Product
                </button>
                
<form id="product-form" hidden>
    <h2>Add a New Product</h2>

    <label for="product-name">Product Name</label>
    <input id="product-name" name="name" type="text" required maxlength="200">

    <label for="product-category">Category</label>
    <input id="product-category" name="category" type="text" required maxlength="100">

    <label for="product-description">Description</label>
    <textarea id="product-description" name="description" rows="3"></textarea>

    <label for="product-price">Price</label>
    <input id="product-price" name="price" type="number" min="0" step="0.01">

    <label for="product-image">Image URL</label>
    <input id="product-image" name="image_url" type="url">

    <label for="product-moq">Minimum Order Quantity (MOQ)</label>
    <input id="product-moq" name="moq" type="text">

    <button type="submit">Save Product</button>
    <button id="cancel-product-button" type="button">Cancel</button>
</form>

    
                <p id="products-message" role="status"></p>
    
                <div id="products-container"></div>
            </section>
        </section>
        


    </main>

    <script src="js/admin.js"></script>
</body>
</html>
